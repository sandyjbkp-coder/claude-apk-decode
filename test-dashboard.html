<!DOCTYPE html>
<html>
<head>
    <title>Test Dashboard</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #1a1a2e; color: #eee; }
        .card { background: #16213e; padding: 15px; margin: 10px 0; border-radius: 8px; }
        .metric { display: inline-block; margin: 10px; padding: 10px; background: #0f3460; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>System Dashboard</h1>
    <div class="card">
        <h2>CPU</h2>
        <div class="metric">Usage: 45%</div>
        <div class="metric">Temp: 42°C</div>
    </div>
    <div class="card">
        <h2>Memory</h2>
        <div class="metric">Used: 2.1GB / 8GB</div>
        <div class="metric">Free: 5.9GB</div>
    </div>
</body>
</html>
